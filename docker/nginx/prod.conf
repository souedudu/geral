# ────────────────────────────────────────────────────────────
# RESTAURANTE :80 → redirect HTTPS + ACME challenge
# default_server: também atende o IP / host não nomeado
# ────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bravopdv.com.br *.bravopdv.com.br _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ────────────────────────────────────────────────────────────
# RESTAURANTE :443 (default_server)
# Frontend: estático (build do Vite)
# Backend:  /api, /sanctum, /horizon, /storage → PHP-FPM
# Multi-tenant por subdomínio (*.bravopdv.com.br) → cert wildcard
# ────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    http2 on;
    listen [::]:443 ssl default_server;
    server_name bravopdv.com.br *.bravopdv.com.br;

    ssl_certificate     /etc/letsencrypt/live/bravopdv.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bravopdv.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    if ($bad_bot) { return 444; }
    if ($not_allowed_method) { return 405; }

    limit_conn conn_per_ip 20;
    limit_req zone=req_general burst=60 nodelay;

    client_max_body_size 50M;

    # Frontend (Vite build) servido como estático
    root /var/www/restaurante_frontend;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ---- Backend Laravel ----
    # /api, /sanctum, /horizon → roteia para o public do Laravel
    # (/storage tem bloco próprio logo abaixo: é arquivo enviado, não rota)
    location ~ ^/(api|sanctum|horizon)(/.*)?$ {
        root /var/www/restaurante/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Arquivos enviados pelo painel (logo e capa do auto-atendimento, imagens de
    # produto) — gravados pelo Laravel em storage/app/public.
    #
    # `^~` é obrigatório aqui, não é enfeite: sem ele o bloco de estáticos lá embaixo
    # (regex de .jpg/.png/...) vence este prefixo, porque em nginx um regex que casa
    # tem prioridade sobre um prefixo comum. A imagem era então procurada na raiz do
    # frontend — e voltava 404 para todo upload, apesar de o arquivo existir.
    #
    # O alias aponta direto para o volume de storage, sem passar pelo symlink
    # `public/storage`: o symlink é relativo e resolveria para um caminho que este
    # container não enxerga. Assim também não dependemos de `artisan storage:link`
    # ter rodado dentro do volume.
    location ^~ /storage/ {
        alias /var/www/restaurante/storage/app/public/;

        # O nome do arquivo é sorteado a cada upload, então a URL muda quando a imagem
        # é trocada — dá para cachear sem medo de servir a logo antiga.
        expires 7d;
        access_log off;
    }

    location ~ \.php$ {
        root /var/www/restaurante/public;
        fastcgi_pass restaurante_app:9000;
        # Path real dentro do container restaurante_app
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /var/www/public;
        fastcgi_param HTTP_X_SUBDOMAIN $subdomain;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }

    # Service worker (app instalável + notificações do salão). Não pode cair no bloco de
    # estáticos abaixo: com 30 dias de "immutable", uma correção no sw.js levaria semanas
    # para chegar aos celulares. `expires epoch` (no-cache) em vez de add_header, para não
    # derrubar os cabeçalhos de segurança herdados do server.
    location = /sw.js {
        try_files $uri =404;
        expires epoch;
    }

    # ---- Frontend assets ----
    location ~* \.(?:jpg|jpeg|gif|png|ico|webp|svg|css|js|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos sensíveis
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
